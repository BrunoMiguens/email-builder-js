name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - run: npm ci

      - run: npm run build --workspaces

      # document-core is published first: @push-co/email-builder's type declarations
      # import from it, so consumers need it resolvable to typecheck.
      - name: Publish document-core
        run: npm publish --workspace packages/document-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish email-builder
        run: npm publish --workspace packages/email-builder
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
