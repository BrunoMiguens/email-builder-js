name: Publish Package

on:
  push:
    tags:
      - 'v*'

# GitHub Packages needs write access to publish; the built-in GITHUB_TOKEN carries it.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@push-co'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - run: npm ci

      - run: npm run build --workspaces

      # document-core is published first: @push-co/email-builder's type declarations
      # import from it, so consumers need it resolvable to typecheck.
      - name: Publish document-core
        run: npm publish --workspace packages/document-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish email-builder
        run: npm publish --workspace packages/email-builder
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
